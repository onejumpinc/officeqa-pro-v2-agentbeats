name: Quick Submit

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

jobs:
  run-scenario:
    if: startsWith(github.head_ref, 'quick-submit-')
    uses: RDI-Foundation/agentbeats-leaderboard-template/.github/workflows/quick-submit-runner.yml@v2
    permissions:
      id-token: write
      contents: write
    with:
      num_shards: 10
    secrets:
      GREEN_SECRETS_JSON: >-
        {"hf_token":${{ toJSON(secrets.OFFICEQA_PRO_V2_HF_TOKEN) }}}
